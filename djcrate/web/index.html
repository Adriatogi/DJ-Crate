<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DJ Crate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">DJ Crate</div>
    <nav class="tabs">
      <button class="tab active" data-tab="crates">Crates</button>
      <button class="tab" data-tab="sets">Set Setter</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="spacer"></div>
    <div id="status-strip"></div>
    <button id="activity-btn" class="icon-btn" title="Activity">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span id="activity-count" class="badge" hidden></span>
    </button>
  </header>

  <div id="banners"></div>

  <main>
    <div id="view-crates" class="view active">
      <aside id="sidebar">
        <div class="side-actions">
          <button id="btn-import-spotify" class="btn primary block">+ Import Spotify playlist</button>
          <div class="row gap">
            <button id="btn-add-manual" class="btn small grow">+ Add track</button>
            <button id="btn-import-folder" class="btn small grow">Import folder</button>
          </div>
        </div>
        <nav id="smart-list"></nav>
        <div class="side-title">
          <span>My crates</span>
          <span>
            <button id="btn-new-crate" class="icon-btn small" title="New crate">+♪</button>
            <button id="btn-new-folder" class="icon-btn small" title="New folder">+📁</button>
          </span>
        </div>
        <div id="tree"></div>
        <div id="tree-root-drop" class="root-drop">Drop here to move to top level</div>
      </aside>

      <section id="main-pane">
        <div class="toolbar">
          <div class="view-title">
            <h2 id="view-name">All Tracks</h2>
            <div id="view-meta" class="muted small"></div>
          </div>
          <div class="spacer"></div>
          <input id="search" type="search" placeholder="Search title, artist, album, notes…">
          <button id="btn-sort" class="btn" title="Sort">Sort ▾</button>
          <button id="btn-resync" class="btn" hidden>↻ Re-sync from Spotify</button>
          <button id="btn-download-all" class="btn primary">⬇ Download All</button>
          <button id="btn-view-menu" class="icon-btn" title="More">⋯</button>
        </div>
        <div id="bulkbar" hidden></div>
        <div class="table-wrap" id="table-wrap">
          <table id="tracks">
            <thead>
              <tr>
                <th class="c-sel"><input type="checkbox" id="select-all" class="sel" title="Select all"></th>
                <th class="c-cover"></th>
                <th class="sortable" data-sort="title">Title</th>
                <th class="sortable" data-sort="artists">Artist</th>
                <th class="c-album sortable" data-sort="album">Album</th>
                <th class="c-time sortable" data-sort="duration">Time</th>
                <th class="c-link">YouTube link</th>
                <th class="c-play"></th>
                <th class="c-flag sortable" data-sort="edited" title="Edited — you changed the audio on purpose; skips the length check">Edited</th>
                <th class="c-flag sortable" data-sort="cleaned" title="Cleaned — BPM and grid line up in Rekordbox">Cleaned</th>
                <th class="c-flag sortable" data-sort="verified" title="Verified — you know this song and it's gig-ready">Verified</th>
                <th class="c-status sortable" data-sort="status">Status</th>
                <th class="c-action"></th>
              </tr>
            </thead>
            <tbody id="track-body"></tbody>
          </table>
          <div id="empty-state" class="empty" hidden></div>
        </div>
      </section>

      <aside id="detail" hidden></aside>
    </div>

    <div id="view-sets" class="view"></div>
    <div id="view-settings" class="view"></div>
  </main>

  <div id="activity-panel" class="popover activity" hidden></div>
  <div id="overlay" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <audio id="audio" preload="none"></audio>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
