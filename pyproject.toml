[project]
name = "djcrate"
version = "0.1.0"
description = "Local DJ library prep: Spotify playlists to crates, paste-your-own YouTube links, tagged MP3s for Rekordbox."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.0",
    "yt-dlp",
    "mutagen>=1.47",
    "httpx>=0.27",
    "keyring>=25",
    "send2trash>=1.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djcrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
